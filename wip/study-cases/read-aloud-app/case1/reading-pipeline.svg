<svg width="100%" viewBox="0 0 560 970" xmlns="http://www.w3.org/2000/svg">
<style>
:root {
  --surface-0:#16161a; --surface-1:#1c1c20; --surface-2:#222226;
  --text-primary:#ededea; --text-secondary:#a8a69e; --text-muted:#76756f;
  --border:#393834; --border-strong:#4a4944;
  --c-gray-50:#2C2C2A;   --c-gray-100:#444441;   --c-gray-600:#B4B2A9;  --c-gray-800:#D3D1C7;  --c-gray-900:#F1EFE8;
  --c-blue-50:#042C53;   --c-blue-100:#0C447C;   --c-blue-600:#85B7EB;  --c-blue-800:#B5D4F4;  --c-blue-900:#E6F1FB;
  --c-teal-50:#04342C;   --c-teal-100:#085041;   --c-teal-600:#5DCAA5;  --c-teal-800:#9FE1CB;  --c-teal-900:#E1F5EE;
  --c-coral-50:#4A1B0C;  --c-coral-100:#712B13;  --c-coral-600:#F0997B; --c-coral-800:#F5C4B3; --c-coral-900:#FAECE7;
  --c-purple-50:#26215C; --c-purple-100:#3C3489; --c-purple-600:#AFA9EC;--c-purple-800:#CECBF6;--c-purple-900:#EEEDFE;
  --c-amber-50:#412402;  --c-amber-100:#633806;  --c-amber-600:#EF9F27;--c-amber-800:#FAC775; --c-amber-900:#FAEEDA;
  --c-red-50:#501313;    --c-red-100:#791F1F;    --c-red-600:#F09595;  --c-red-800:#F7C1C1;   --c-red-900:#FCEBEB;
  --c-green-50:#173404;  --c-green-100:#27500A;  --c-green-600:#97C459;--c-green-800:#C0DD97; --c-green-900:#EAF3DE;
  --c-pink-50:#4B1528;   --c-pink-100:#72243E;   --c-pink-600:#ED93B1; --c-pink-800:#F4C0D1;  --c-pink-900:#FBEAF0;
}
@media (prefers-color-scheme: light) {
  :root {
    --surface-0:#fff; --surface-1:#f8f8f6; --surface-2:#fff;
    --text-primary:#1a1a1a; --text-secondary:#5f5e5a; --text-muted:#888780;
    --border:#d3d1c7; --border-strong:#b4b2a9;
    --c-gray-50:#F1EFE8;   --c-gray-100:#D3D1C7;   --c-gray-600:#5F5E5A;  --c-gray-800:#444441;  --c-gray-900:#2C2C2A;
    --c-blue-50:#E6F1FB;   --c-blue-100:#B5D4F4;   --c-blue-600:#185FA5;  --c-blue-800:#0C447C;  --c-blue-900:#042C53;
    --c-teal-50:#E1F5EE;   --c-teal-100:#9FE1CB;   --c-teal-600:#0F6E56;  --c-teal-800:#085041;  --c-teal-900:#04342C;
    --c-coral-50:#FAECE7;  --c-coral-100:#F5C4B3;  --c-coral-600:#993C1D; --c-coral-800:#712B13; --c-coral-900:#4A1B0C;
    --c-purple-50:#EEEDFE; --c-purple-100:#CECBF6; --c-purple-600:#534AB7;--c-purple-800:#3C3489;--c-purple-900:#26215C;
    --c-amber-50:#FAEEDA;  --c-amber-100:#FAC775;  --c-amber-600:#854F0B;--c-amber-800:#633806; --c-amber-900:#412402;
    --c-red-50:#FCEBEB;    --c-red-100:#F7C1C1;    --c-red-600:#A32D2D;  --c-red-800:#791F1F;   --c-red-900:#501313;
    --c-green-50:#EAF3DE;  --c-green-100:#C0DD97;  --c-green-600:#3B6D11;--c-green-800:#27500A; --c-green-900:#173404;
    --c-pink-50:#FBEAF0;   --c-pink-100:#F4C0D1;   --c-pink-600:#993556; --c-pink-800:#72243E;  --c-pink-900:#4B1528;
  }
}
svg { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.t  { font-size:14px; fill:var(--text-primary); }
.th { font-size:14px; font-weight:600; fill:var(--text-primary); }
.ts { font-size:12px; fill:var(--text-secondary); }
.box rect { fill:var(--surface-1); stroke:var(--border-strong); }
.arr { stroke:var(--border-strong); stroke-width:1.5; fill:none; }
.leader { stroke:var(--text-muted); stroke-width:0.5; stroke-dasharray:3 3; fill:none; }
</style>
<rect x="0" y="0" width="560" height="970" fill="var(--surface-0)"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Box 1 : input (gray) -->
<g>
  <rect x="80" y="40" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-gray-50)" stroke="var(--c-gray-600)"/>
  <text class="th" x="280" y="62" text-anchor="middle" dominant-baseline="central" fill="var(--c-gray-900)">1 · Paste text or upload a file</text>
  <text class="ts" x="280" y="80" text-anchor="middle" dominant-baseline="central" fill="var(--c-gray-600)">you pick: Text or Markdown</text>
</g>
<line x1="280" y1="96" x2="280" y2="156" class="arr" marker-end="url(#arrow)"/>

<!-- Box 2 : render (teal) -->
<g>
  <rect x="80" y="156" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-teal-50)" stroke="var(--c-teal-600)"/>
  <text class="th" x="280" y="178" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">2 · Render it once, on screen</text>
  <text class="ts" x="280" y="196" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-600)">read-only reading view</text>
</g>
<line x1="280" y1="212" x2="280" y2="272" class="arr" marker-end="url(#arrow)"/>

<!-- Box 3 : the spine (teal) -->
<g>
  <rect x="80" y="272" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-teal-50)" stroke="var(--c-teal-600)"/>
  <text class="th" x="280" y="294" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">3 · Split into a numbered word list</text>
  <text class="ts" x="280" y="312" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-600)">the spine — each word knows its spot</text>
</g>
<line x1="280" y1="328" x2="280" y2="388" class="arr" marker-end="url(#arrow)"/>

<!-- Box 4 : chunk + normalize (teal) -->
<g>
  <rect x="80" y="388" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-teal-50)" stroke="var(--c-teal-600)"/>
  <text class="th" x="280" y="410" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">4 · Chunk + clean text for speech</text>
  <text class="ts" x="280" y="428" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-600)">short first chunk, normalize</text>
</g>
<line x1="280" y1="444" x2="280" y2="504" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="298" y="476" text-anchor="start" fill="var(--text-muted)">clean text →</text>

<!-- Box 5 : HeadTTS (amber) -->
<g>
  <rect x="80" y="504" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-amber-50)" stroke="var(--c-amber-600)"/>
  <text class="th" x="280" y="526" text-anchor="middle" dominant-baseline="central" fill="var(--c-amber-800)">5 · HeadTTS speaks each chunk</text>
  <text class="ts" x="280" y="544" text-anchor="middle" dominant-baseline="central" fill="var(--c-amber-600)">returns audio + word times</text>
</g>
<line x1="280" y1="560" x2="280" y2="620" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="298" y="592" text-anchor="start" fill="var(--text-muted)">← audio + word times</text>

<!-- Box 6 : attach times (teal) -->
<g>
  <rect x="80" y="620" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-teal-50)" stroke="var(--c-teal-600)"/>
  <text class="th" x="280" y="642" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">6 · Attach times to the word list</text>
  <text class="ts" x="280" y="660" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-600)">one unified timeline</text>
</g>
<line x1="280" y1="676" x2="280" y2="736" class="arr" marker-end="url(#arrow)"/>

<!-- Box 7 : playback (teal) -->
<g>
  <rect x="80" y="736" width="400" height="56" rx="8" stroke-width="0.5" fill="var(--c-teal-50)" stroke="var(--c-teal-600)"/>
  <text class="th" x="280" y="758" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">7 · Play · highlight · click-to-seek</text>
  <text class="ts" x="280" y="776" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-600)">the document is the player</text>
</g>

<!-- Insight callout -->
<rect x="40" y="828" width="480" height="56" rx="8" fill="var(--surface-1)" stroke="var(--c-blue-600)" stroke-width="0.5"/>
<text class="th" x="280" y="850" text-anchor="middle" dominant-baseline="central" fill="var(--c-blue-800)">HeadTTS is only step 5.</text>
<text class="ts" x="280" y="868" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)">The reading experience — the other six steps — is what we build.</text>

<!-- Legend -->
<g>
  <rect x="40" y="912" width="10" height="10" rx="2" fill="var(--c-gray-600)"/>
  <text class="ts" x="56" y="921" fill="var(--text-secondary)">you</text>
</g>
<g>
  <rect x="110" y="912" width="10" height="10" rx="2" fill="var(--c-teal-600)"/>
  <text class="ts" x="126" y="921" fill="var(--text-secondary)">our engine</text>
</g>
<g>
  <rect x="230" y="912" width="10" height="10" rx="2" fill="var(--c-amber-600)"/>
  <text class="ts" x="246" y="921" fill="var(--text-secondary)">HeadTTS (dependency)</text>
</g>
</svg>
