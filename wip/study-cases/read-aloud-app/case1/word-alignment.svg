<svg width="100%" viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
<style>
:root {
  --surface-0:#16161a; --surface-1:#1c1c20; --surface-2:#222226;
  --text-primary:#ededea; --text-secondary:#a8a69e; --text-muted:#76756f;
  --border:#393834; --border-strong:#4a4944;
  --c-gray-50:#2C2C2A;   --c-gray-100:#444441;   --c-gray-600:#B4B2A9;  --c-gray-800:#D3D1C7;  --c-gray-900:#F1EFE8;
  --c-blue-50:#042C53;   --c-blue-100:#0C447C;   --c-blue-600:#85B7EB;  --c-blue-800:#B5D4F4;  --c-blue-900:#E6F1FB;
  --c-teal-50:#04342C;   --c-teal-100:#085041;   --c-teal-600:#5DCAA5;  --c-teal-800:#9FE1CB;  --c-teal-900:#E1F5EE;
  --c-coral-50:#4A1B0C;  --c-coral-100:#712B13;  --c-coral-600:#F0997B; --c-coral-800:#F5C4B3; --c-coral-900:#FAECE7;
  --c-purple-50:#26215C; --c-purple-100:#3C3489; --c-purple-600:#AFA9EC;--c-purple-800:#CECBF6;--c-purple-900:#EEEDFE;
  --c-amber-50:#412402;  --c-amber-100:#633806;  --c-amber-600:#EF9F27;--c-amber-800:#FAC775; --c-amber-900:#FAEEDA;
  --c-red-50:#501313;    --c-red-100:#791F1F;    --c-red-600:#F09595;  --c-red-800:#F7C1C1;   --c-red-900:#FCEBEB;
  --c-green-50:#173404;  --c-green-100:#27500A;  --c-green-600:#97C459;--c-green-800:#C0DD97; --c-green-900:#EAF3DE;
  --c-pink-50:#4B1528;   --c-pink-100:#72243E;   --c-pink-600:#ED93B1; --c-pink-800:#F4C0D1;  --c-pink-900:#FBEAF0;
}
@media (prefers-color-scheme: light) {
  :root {
    --surface-0:#fff; --surface-1:#f8f8f6; --surface-2:#fff;
    --text-primary:#1a1a1a; --text-secondary:#5f5e5a; --text-muted:#888780;
    --border:#d3d1c7; --border-strong:#b4b2a9;
    --c-gray-50:#F1EFE8;   --c-gray-100:#D3D1C7;   --c-gray-600:#5F5E5A;  --c-gray-800:#444441;  --c-gray-900:#2C2C2A;
    --c-blue-50:#E6F1FB;   --c-blue-100:#B5D4F4;   --c-blue-600:#185FA5;  --c-blue-800:#0C447C;  --c-blue-900:#042C53;
    --c-teal-50:#E1F5EE;   --c-teal-100:#9FE1CB;   --c-teal-600:#0F6E56;  --c-teal-800:#085041;  --c-teal-900:#04342C;
    --c-coral-50:#FAECE7;  --c-coral-100:#F5C4B3;  --c-coral-600:#993C1D; --c-coral-800:#712B13; --c-coral-900:#4A1B0C;
    --c-purple-50:#EEEDFE; --c-purple-100:#CECBF6; --c-purple-600:#534AB7;--c-purple-800:#3C3489;--c-purple-900:#26215C;
    --c-amber-50:#FAEEDA;  --c-amber-100:#FAC775;  --c-amber-600:#854F0B;--c-amber-800:#633806; --c-amber-900:#412402;
    --c-red-50:#FCEBEB;    --c-red-100:#F7C1C1;    --c-red-600:#A32D2D;  --c-red-800:#791F1F;   --c-red-900:#501313;
    --c-green-50:#EAF3DE;  --c-green-100:#C0DD97;  --c-green-600:#3B6D11;--c-green-800:#27500A; --c-green-900:#173404;
    --c-pink-50:#FBEAF0;   --c-pink-100:#F4C0D1;   --c-pink-600:#993556; --c-pink-800:#72243E;  --c-pink-900:#4B1528;
  }
}
svg { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.t  { font-size:14px; fill:var(--text-primary); }
.th { font-size:14px; font-weight:600; fill:var(--text-primary); }
.ts { font-size:12px; fill:var(--text-secondary); }
.leader { stroke:var(--text-muted); stroke-width:1; stroke-dasharray:3 3; fill:none; }
</style>
<rect x="0" y="0" width="750" height="500" fill="var(--surface-0)"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Caption -->
<text class="th" x="60" y="40" text-anchor="start" fill="var(--text-primary)">You paste:  “I paid $5 today.”  — shown on screen as four words</text>

<!-- Row label: screen -->
<text class="ts" x="60" y="112" text-anchor="start" fill="var(--text-secondary)">On screen — the word list (this is where the highlight lands)</text>

<!-- Screen word chips (teal); $5 is highlighted (blue) -->
<g>
  <rect x="72" y="140" width="70" height="40" rx="8" fill="var(--c-teal-50)" stroke="var(--c-teal-600)" stroke-width="0.5"/>
  <text class="th" x="107" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">I</text>
</g>
<g>
  <rect x="182" y="140" width="70" height="40" rx="8" fill="var(--c-teal-50)" stroke="var(--c-teal-600)" stroke-width="0.5"/>
  <text class="th" x="217" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">paid</text>
</g>
<g>
  <rect x="381" y="140" width="70" height="40" rx="8" fill="var(--c-blue-50)" stroke="var(--c-blue-600)" stroke-width="1.5"/>
  <text class="th" x="416" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--c-blue-800)">$5</text>
</g>
<g>
  <rect x="591" y="140" width="70" height="40" rx="8" fill="var(--c-teal-50)" stroke="var(--c-teal-600)" stroke-width="0.5"/>
  <text class="th" x="626" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--c-teal-800)">today</text>
</g>

<!-- Leaders : chip -> spoken block(s) -->
<line x1="107" y1="180" x2="107" y2="270" class="leader"/>
<line x1="217" y1="180" x2="217" y2="270" class="leader"/>
<line x1="626" y1="180" x2="626" y2="270" class="leader"/>
<!-- $5 fans to TWO spoken blocks (blue) -->
<line x1="416" y1="180" x2="338" y2="270" stroke="var(--c-blue-600)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="416" y1="180" x2="474" y2="270" stroke="var(--c-blue-600)" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Time axis -->
<text class="ts" x="635" y="252" text-anchor="start" fill="var(--text-muted)">audio time →</text>
<line x1="60" y1="268" x2="712" y2="268" stroke="var(--border-strong)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Spoken blocks (amber); five + dollars belong to $5 (blue) -->
<g>
  <rect x="60" y="270" width="94" height="40" rx="6" fill="var(--c-amber-50)" stroke="var(--c-amber-600)" stroke-width="0.5"/>
  <text class="t" x="107" y="290" text-anchor="middle" dominant-baseline="central" fill="var(--c-amber-800)">I</text>
</g>
<g>
  <rect x="154" y="270" width="126" height="40" rx="6" fill="var(--c-amber-50)" stroke="var(--c-amber-600)" stroke-width="0.5"/>
  <text class="t" x="217" y="290" text-anchor="middle" dominant-baseline="central" fill="var(--c-amber-800)">paid</text>
</g>
<g>
  <rect x="280" y="270" width="116" height="40" rx="6" fill="var(--c-blue-50)" stroke="var(--c-blue-600)" stroke-width="1"/>
  <text class="t" x="338" y="290" text-anchor="middle" dominant-baseline="central" fill="var(--c-blue-800)">five</text>
</g>
<g>
  <rect x="396" y="270" width="157" height="40" rx="6" fill="var(--c-blue-50)" stroke="var(--c-blue-600)" stroke-width="1"/>
  <text class="t" x="474" y="290" text-anchor="middle" dominant-baseline="central" fill="var(--c-blue-800)">dollars</text>
</g>
<g>
  <rect x="553" y="270" width="147" height="40" rx="6" fill="var(--c-amber-50)" stroke="var(--c-amber-600)" stroke-width="0.5"/>
  <text class="t" x="626" y="290" text-anchor="middle" dominant-baseline="central" fill="var(--c-amber-800)">today</text>
</g>

<!-- Row label: spoken -->
<text class="ts" x="60" y="332" text-anchor="start" fill="var(--text-secondary)">Spoken by HeadTTS — each block is one spoken word, width = its duration</text>

<!-- Playhead (blue) inside the "dollars" block -->
<line x1="469" y1="126" x2="469" y2="318" stroke="var(--c-blue-600)" stroke-width="1.5"/>
<text class="ts" x="469" y="120" text-anchor="middle" fill="var(--c-blue-600)">playhead</text>

<!-- Insight callout -->
<rect x="40" y="358" width="670" height="64" rx="8" fill="var(--surface-1)" stroke="var(--c-blue-600)" stroke-width="0.5"/>
<text class="th" x="375" y="382" text-anchor="middle" dominant-baseline="central" fill="var(--c-blue-800)">Highlight = the word above the playhead.  Click a word = jump the playhead to it.</text>
<text class="ts" x="375" y="404" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)">Almost always 1-to-1 — only rewrites like “$5” → “five dollars” map one screen word to two.</text>

<!-- Legend -->
<g>
  <rect x="40" y="446" width="10" height="10" rx="2" fill="var(--c-teal-600)"/>
  <text class="ts" x="56" y="455" fill="var(--text-secondary)">on-screen word</text>
</g>
<g>
  <rect x="200" y="446" width="10" height="10" rx="2" fill="var(--c-amber-600)"/>
  <text class="ts" x="216" y="455" fill="var(--text-secondary)">spoken word (HeadTTS)</text>
</g>
<g>
  <rect x="410" y="446" width="10" height="10" rx="2" fill="var(--c-blue-600)"/>
  <text class="ts" x="426" y="455" fill="var(--text-secondary)">highlight / the tricky map</text>
</g>
</svg>
